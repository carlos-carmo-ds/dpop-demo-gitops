apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dpop-demo
  namespace: argocd
spec:
  project: default
  source:
    # SSH: o Argo CD lê com a deploy key, e o Image Updater reutiliza a mesma credencial
    # para fazer commit das tags novas (write-back "git").
    repoURL: git@github.com:carlos-carmo-ds/dpop-demo-gitops.git
    targetRevision: main
    path: charts/dpop-demo
    helm:
      releaseName: dpop-demo
      valueFiles:
        - ../../envs/dev/values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: dpop-demo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
